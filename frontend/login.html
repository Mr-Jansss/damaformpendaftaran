<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Olimpiade Sains</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        
        .login-container {
            width: 100%;
            max-width: 450px;
        }
        
        .login-logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .logo-circle {
            display: inline-block;
            background: var(--white);
            padding: 1.5rem;
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            margin-bottom: 1rem;
            font-size: 3rem;
        }
        
        .login-title {
            color: var(--white);
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        
        .login-subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.1rem;
        }
        
        .login-card {
            background: var(--white);
            border-radius: 1.5rem;
            padding: 2.5rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.5s ease-out;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .password-wrapper {
            position: relative;
        }
        
        .password-toggle {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--gray-500);
            cursor: pointer;
            font-size: 1.1rem;
        }
        
        .password-toggle:hover {
            color: var(--gray-700);
        }
        
        .error-message {
            display: none;
            background-color: #FEE2E2;
            border: 1px solid #FCA5A5;
            color: #991B1B;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
        }
        
        .error-message.show {
            display: block;
        }
        
        .back-link {
            text-align: center;
            margin-top: 1.5rem;
        }
        
        .back-link a {
            color: var(--gray-600);
            text-decoration: none;
            transition: color 0.3s;
        }
        
        .back-link a:hover {
            color: var(--primary);
        }
        
        .credentials-info {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            color: var(--white);
            padding: 1rem;
            border-radius: 0.75rem;
            margin-top: 1.5rem;
            font-size: 0.875rem;
        }
        
        .credentials-info code {
            background: rgba(0, 0, 0, 0.3);
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            font-family: monospace;
        }
        
        .icon-user::before { content: "👤"; margin-right: 0.5rem; }
        .icon-lock::before { content: "🔒"; margin-right: 0.5rem; }
        .icon-login::before { content: "🔐"; margin-right: 0.5rem; }
        .icon-back::before { content: "⬅️"; margin-right: 0.5rem; }
        .icon-info::before { content: "ℹ️"; margin-right: 0.5rem; }
        .icon-alert::before { content: "⚠️"; margin-right: 0.5rem; }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Logo & Title -->
        <div class="login-logo">
            <div class="logo-circle">🏆</div>
            <h1 class="login-title">Olimpiade Sains</h1>
            <p class="login-subtitle">Login ke Dashboard</p>
        </div>

        <!-- Login Card -->
        <div class="login-card">
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label icon-user">Username</label>
                    <input type="text" name="username" required class="form-input" placeholder="Masukkan username" autocomplete="username">
                </div>

                <div class="form-group">
                    <label class="form-label icon-lock">Password</label>
                    <div class="password-wrapper">
                        <input type="password" name="password" id="password" required class="form-input" placeholder="Masukkan password" autocomplete="current-password">
                        <button type="button" id="togglePassword" class="password-toggle" aria-label="Toggle password visibility">
                            👁️
                        </button>
                    </div>
                </div>

                <div id="errorMessage" class="error-message icon-alert">
                    <span id="errorText"></span>
                </div>

                <button type="submit" class="w-full btn btn-primary icon-login" style="font-size: 1.125rem; padding: 0.875rem;">
                    Login
                </button>
            </form>

            <div class="back-link">
                <a href="index.html" class="icon-back">Kembali ke Halaman Utama</a>
            </div>
        </div>

        <!-- Info Credentials (untuk development) -->
        <div class="credentials-info">
            <p style="font-weight: 600; margin-bottom: 0.5rem;" class="icon-info">Kredensial Default:</p>
            <p>Admin: <code>admin / admin123</code></p>
            <p>Panitia: <code>panitia1 / panitia123</code></p>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
