<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clear Storage</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #FF6B00 0%, #FF4500 100%);
            color: white;
            text-align: center;
            padding: 2rem;
        }
        .container {
            background: white;
            color: #333;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        button {
            background: #FF6B00;
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 0.5rem;
            font-size: 1rem;
            cursor: pointer;
            margin: 0.5rem;
        }
        button:hover {
            background: #FF4500;
        }
        .success {
            color: #10B981;
            font-weight: bold;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧹 Clear Browser Storage</h1>
        <p>Klik tombol di bawah untuk membersihkan localStorage dan sessionStorage</p>
        <button onclick="clearStorage()">Clear Storage</button>
        <button onclick="window.location.href='login.html'">Go to Login</button>
        <div id="message"></div>
    </div>

    <script>
        function clearStorage() {
            localStorage.clear();
            sessionStorage.clear();
            document.getElementById('message').innerHTML = '<p class="success">✅ Storage berhasil dibersihkan!</p>';
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 1500);
        }
    </script>
</body>
</html>
