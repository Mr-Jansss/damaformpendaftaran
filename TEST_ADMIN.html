<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Admin Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        
        .container {
            background: white;
            border-radius: 1.5rem;
            padding: 3rem;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: #333;
            margin-bottom: 1rem;
            font-size: 2rem;
        }
        
        .status {
            background: #f0f9ff;
            border-left: 4px solid #3b82f6;
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 0.5rem;
        }
        
        .status.success {
            background: #f0fdf4;
            border-left-color: #10b981;
        }
        
        .status.error {
            background: #fef2f2;
            border-left-color: #ef4444;
        }
        
        .btn-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin: 2rem 0;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 1rem 1.5rem;
            border-radius: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }
        
        .btn-warning {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        }
        
        .test-result {
            background: #f9fafb;
            padding: 1rem;
            border-radius: 0.5rem;
            margin: 0.5rem 0;
            font-family: monospace;
            font-size: 0.875rem;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Test Admin Dashboard</h1>
        <p style="color: #666; margin-bottom: 2rem;">Testing tool untuk memastikan semua fitur berfungsi dengan baik</p>
        
        <div id="backendStatus" class="status">
            <strong>🔄 Checking backend status...</strong>
        </div>
        
        <div class="btn-group">
            <button onclick="clearStorage()" class="btn-danger">
                🧹 Clear Storage
            </button>
            <button onclick="testLogin()" class="btn-success">
                🔐 Test Login
            </button>
            <button onclick="testAPI()" class="btn-warning">
                🔌 Test API
            </button>
            <button onclick="window.location.href='login.html'">
                ➡️ Go to Login
            </button>
            <button onclick="window.location.href='admin-dashboard.html'">
                📊 Go to Dashboard
            </button>
            <button onclick="window.location.href='index.html'">
                🏠 Go to Home
            </button>
        </div>
        
        <div id="testResults"></div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:3000/api';
        
        // Check backend status on load
        window.addEventListener('DOMContentLoaded', checkBackend);
        
        async function checkBackend() {
            const statusDiv = document.getElementById('backendStatus');
            try {
                const response = await fetch('http://localhost:3000/api/health');
                const data = await response.json();
                
                if (data.success) {
                    statusDiv.className = 'status success';
                    statusDiv.innerHTML = '<strong>✅ Backend Server: ONLINE</strong><br>Server is running properly';
                } else {
                    throw new Error('Server returned error');
                }
            } catch (error) {
                statusDiv.className = 'status error';
                statusDiv.innerHTML = '<strong>❌ Backend Server: OFFLINE</strong><br>Please start the backend server first!';
            }
        }
        
        function clearStorage() {
            localStorage.clear();
            sessionStorage.clear();
            showResult('✅ Storage cleared successfully!', 'success');
        }
        
        async function testLogin() {
            showResult('🔄 Testing login...', 'info');
            
            try {
                const response = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: 'admin',
                        password: 'admin123'
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    localStorage.setItem('token', data.data.token);
                    localStorage.setItem('user', JSON.stringify(data.data.user));
                    showResult('✅ Login test PASSED!<br>Token: ' + data.data.token.substring(0, 50) + '...', 'success');
                } else {
                    showResult('❌ Login test FAILED: ' + data.message, 'error');
                }
            } catch (error) {
                showResult('❌ Login test ERROR: ' + error.message, 'error');
            }
        }
        
        async function testAPI() {
            showResult('🔄 Testing API endpoints...', 'info');
            
            const token = localStorage.getItem('token');
            if (!token) {
                showResult('❌ No token found. Please test login first!', 'error');
                return;
            }
            
            try {
                // Test statistik endpoint
                const response = await fetch(`${API_BASE_URL}/peserta/statistik`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showResult('✅ API test PASSED!<br>Data: ' + JSON.stringify(data.data).substring(0, 100) + '...', 'success');
                } else {
                    showResult('❌ API test FAILED: ' + data.message, 'error');
                }
            } catch (error) {
                showResult('❌ API test ERROR: ' + error.message, 'error');
            }
        }
        
        function showResult(message, type) {
            const resultsDiv = document.getElementById('testResults');
            const resultDiv = document.createElement('div');
            resultDiv.className = 'test-result';
            resultDiv.innerHTML = message;
            
            if (type === 'success') {
                resultDiv.style.borderLeft = '4px solid #10b981';
            } else if (type === 'error') {
                resultDiv.style.borderLeft = '4px solid #ef4444';
            } else {
                resultDiv.style.borderLeft = '4px solid #3b82f6';
            }
            
            resultsDiv.insertBefore(resultDiv, resultsDiv.firstChild);
        }
    </script>
</body>
</html>
